<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1410" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="LIFE QUEST 主題歌ミュージックビデオ" />
  <title>LIFE QUEST — Music Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f7f1e8;
      --muted: rgba(247, 241, 232, 0.72);
      --soft: rgba(247, 241, 232, 0.5);
      --gold: #e4c089;
      --gold-deep: #c8965a;
      --sea: #6fb4b0;
      --panel: rgba(18, 14, 12, 0.55);
      --line: rgba(247, 241, 232, 0.16);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      color: var(--ink);
      font-family: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #120e0c;
      overflow-x: hidden;
    }

    .stage {
      position: relative;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .bg-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 55% 20%;
      filter: saturate(0.92) contrast(1.05) brightness(0.72);
      transform: scale(1.04);
      animation: drift 18s ease-in-out infinite alternate;
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(12, 10, 9, 0.35) 0%, rgba(12, 10, 9, 0.2) 35%, rgba(12, 10, 9, 0.78) 100%),
        radial-gradient(70% 55% at 70% 15%, rgba(228, 192, 137, 0.28), transparent 60%),
        radial-gradient(55% 45% at 15% 80%, rgba(111, 180, 176, 0.18), transparent 55%);
    }
    @keyframes drift {
      from { transform: scale(1.04) translate3d(0, 0, 0); }
      to { transform: scale(1.08) translate3d(-1.2%, -1%, 0); }
    }

    .panel {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      padding: 18px 16px 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: rise 0.7s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chip {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.18em;
      font-weight: 700;
    }

    .artist {
      width: min(100%, 280px);
      aspect-ratio: 3 / 4;
      margin: 0 auto 14px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(228, 192, 137, 0.28);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      line-height: 0;
      animation: softIn 1s ease 0.15s both;
    }
    .artist img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }
    @keyframes softIn {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    .brand {
      margin: 0 0 4px;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(2rem, 8vw, 2.7rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      color: #f8efe2;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
    }
    .sub {
      margin: 0 0 8px;
      color: var(--soft);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .lede {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .player-wrap {
      width: 100%;
      margin: 0 0 12px;
      border-radius: 14px;
      overflow: hidden;
      background: #0b0a09;
      border: 1px solid rgba(247, 241, 232, 0.1);
      line-height: 0;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #0b0a09;
    }

    .actions {
      display: grid;
      gap: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.98rem;
      letter-spacing: 0.02em;
    }
    .btn-primary {
      color: #24180e;
      background: linear-gradient(135deg, #efd2a4, #c8965a);
      box-shadow: 0 10px 26px rgba(200, 150, 90, 0.28);
    }
    .btn-secondary {
      color: var(--ink);
      background: rgba(247, 241, 232, 0.08);
      border: 1px solid rgba(247, 241, 232, 0.18);
    }
    .btn:active { transform: scale(0.98); }

    .note {
      margin: 12px 0 0;
      color: var(--soft);
      font-size: 0.72rem;
      line-height: 1.5;
    }

    @media (min-width: 720px) {
      .panel { padding: 22px 22px 20px; }
      .artist { width: 300px; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <img class="bg-photo" src="artist-cover.jpg?v=4" alt="" />
  </div>

  <main class="stage">
    <section class="panel">
      <p class="chip">LIFE QUEST / MUSIC VIDEO</p>
      <div class="artist">
        <img src="artist-cover.jpg?v=4" width="900" height="1200" alt="LIFE QUEST アーティスト" />
      </div>
      <h1 class="brand">LIFE QUEST</h1>
      <p class="sub">Theme Song MV</p>
      <p class="lede">会場のみなさんへ。<br />完成したミュージックビデオを、下から視聴・保存できます。</p>

      <div class="player-wrap">
        <video
          controls
          playsinline
          preload="metadata"
          poster="mv-poster.jpg?v=4"
          src="Life-Quest-MV.mp4?v=4"
        >
          お使いの端末では再生できない場合があります。ダウンロードしてください。
        </video>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="Life-Quest-MV.mp4" download="Life-Quest-MV.mp4">MVをダウンロード</a>
        <a class="btn btn-secondary" href="Life-Quest.m4a" download="Life-Quest.m4a">音源のみ（m4a）</a>
      </div>
      <p class="note">
        MV：約4分40秒 / 1080p<br />
        保存できないときは、再生バーの「…」や共有から保存してください。
      </p>
    </section>
  </main>
</body>
</html>
