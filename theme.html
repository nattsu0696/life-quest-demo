<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#040b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>LIFE QUEST 主題歌</title>
  <style>
    :root {
      --bg: #040b10;
      --text: #f2f7f6;
      --muted: rgba(242, 247, 246, 0.72);
      --accent: #2fd2b7;
      --panel: rgba(7, 21, 28, 0.94);
      --border: rgba(232, 244, 242, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px 12px;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(90% 60% at 70% 10%, rgba(255, 210, 140, 0.22), transparent 55%),
        radial-gradient(80% 50% at 10% 20%, rgba(120, 220, 210, 0.18), transparent 50%),
        linear-gradient(180deg, #0a161c 0%, #12262e 50%, #1a2e28 100%);
    }
    .card {
      width: min(100%, 560px);
      padding: 12px 12px 16px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .chip {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.14em;
      font-weight: 700;
    }
    .jacket-wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 12px;
      border-radius: 18px;
      overflow: hidden;
      background: #102028;
      line-height: 0;
      box-shadow:
        0 22px 44px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .jacket {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      vertical-align: top;
      border: 0;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
    }
    .lede {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }
    audio {
      width: 100%;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #2fd2b7, #1aa890);
      color: #042018;
      font-weight: 800;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(47, 210, 183, 0.28);
    }
    .btn:active { transform: scale(0.98); }
    .note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="chip">LIFE QUEST / THEME SONG</p>
    <div class="jacket-wrap">
      <img
        class="jacket"
        src="life-quest-jacket.jpg?v=3"
        width="1024"
        height="1024"
        alt="LIFE QUEST 主題歌ジャケット"
      />
    </div>
    <h1>主題歌</h1>
    <p class="lede">会場のみなさんへ。<br />ジャケットの曲を、下からダウンロードできます。</p>
    <audio controls preload="metadata" src="Life-Quest.m4a?v=3">
      お使いの端末では再生できない場合があります。ダウンロードしてください。
    </audio>
    <a class="btn" href="Life-Quest.m4a" download="Life-Quest.m4a">ダウンロード</a>
    <p class="note">ファイル名：Life Quest.m4a<br />保存できないときは、再生バーの「…」や共有から保存してください。</p>
  </main>
</body>
</html>
