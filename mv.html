<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#040b10" />
  <title>LIFE QUEST MV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #040b10;
      --panel: rgba(7, 21, 28, 0.82);
      --text: #f2f7f6;
      --muted: rgba(242, 247, 246, 0.72);
      --accent: #4eb8e6;
      --line: rgba(232, 244, 242, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(80% 50% at 80% 0%, rgba(78, 184, 230, 0.16), transparent 55%),
        radial-gradient(60% 40% at 10% 80%, rgba(240, 179, 90, 0.1), transparent 50%),
        var(--bg);
    }
    .wrap {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    .chip {
      margin: 0 0 10px;
      color: var(--accent);
      letter-spacing: 0.14em;
      font-size: 11px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 10px;
      font-family: Syne, "IBM Plex Sans JP", sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
    }
    .lede {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.7;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }
    .stat-label {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .stat-value {
      margin: 0;
      font-family: Syne, sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
    }
    .player {
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #000;
      margin-bottom: 16px;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      background: #000;
    }
    .actions {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 18px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(78, 184, 230, 0.45);
      background: rgba(78, 184, 230, 0.14);
      color: var(--text);
      text-decoration: none;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: rgba(78, 184, 230, 0.22); }
    .btn-secondary {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.04);
    }
    .note {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    @media (max-width: 640px) {
      .stats, .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="chip">LIFE QUEST / MV</p>
    <h1>人生を、一度きりで決めなくていい。</h1>
    <p class="lede">LIFE QUEST の世界観を、短い映像で体験できます。視聴も、動画・音声の保存もできます。</p>

    <section class="stats" aria-label="カウンター">
      <div class="stat">
        <p class="stat-label">視聴回数</p>
        <p class="stat-value" id="mv-view-count">—</p>
      </div>
      <div class="stat">
        <p class="stat-label">ダウンロード（動画＋音声）</p>
        <p class="stat-value" id="mv-dl-count">—</p>
      </div>
    </section>

    <div class="player">
      <video id="mv-video" controls playsinline preload="metadata" poster="">
        <source src="assets/Life-Quest-MV.mp4" type="video/mp4" />
        お使いのブラウザは動画再生に対応していません。
      </video>
    </div>

    <div class="actions">
      <a class="btn" id="dl-video" href="assets/Life-Quest-MV.mp4" download="Life-Quest-MV.mp4">動画をダウンロード</a>
      <a class="btn btn-secondary" id="dl-audio" href="assets/Life-Quest-audio.mp3" download="Life-Quest-audio.mp3">音声をダウンロード</a>
    </div>
    <p class="note">視聴回数・ダウンロード数は参考値です。ファイルは <code>assets/Life-Quest-MV.mp4</code> と <code>assets/Life-Quest-audio.mp3</code> を置くと有効になります。</p>
    <p class="nav"><a href="./">◀ ゲームデモへ</a></p>
  </main>

  <script src="counters.js?v=176"></script>
  <script>
    (() => {
      const C = window.LQ_COUNTERS;
      if (!C) return;
      const viewEl = document.getElementById("mv-view-count");
      const dlEl = document.getElementById("mv-dl-count");
      const video = document.getElementById("mv-video");
      let viewed = false;

      C.show(C.keys.mvViews, viewEl);
      C.show(C.keys.mvDownloads, dlEl);

      async function countView() {
        if (viewed) return;
        viewed = true;
        await C.bump(C.keys.mvViews, viewEl);
      }

      video?.addEventListener("play", countView, { once: true });

      async function countDownload(e) {
        // 先にカウントしてから遷移（同一タブdownloadでも概ね動く）
        e.preventDefault();
        const href = e.currentTarget.getAttribute("href");
        await C.bump(C.keys.mvDownloads, dlEl);
        const a = document.createElement("a");
        a.href = href;
        a.download = e.currentTarget.getAttribute("download") || "";
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      document.getElementById("dl-video")?.addEventListener("click", countDownload);
      document.getElementById("dl-audio")?.addEventListener("click", countDownload);
    })();
  </script>
</body>
</html>
